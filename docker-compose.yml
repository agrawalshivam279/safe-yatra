version: '3.8'

services:
  # ─── Infrastructure ────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: safeyatra-db
    environment:
      POSTGRES_DB: safeyatra
      POSTGRES_USER: safeyatra_user
      POSTGRES_PASSWORD: safeyatra_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeyatra_user -d safeyatra"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safeyatra-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Services ──────────────────────
  ml-risk-engine:
    build: ./ml-risk-engine
    container_name: safeyatra-ml
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-demo_key}
      - DATABASE_URL=postgresql://safeyatra_user:safeyatra_pass@postgres:5432/safeyatra
      - SIMULATION_MODE=true
    depends_on:
      postgres:
        condition: service_healthy

  backend-spatial:
    build: ./backend-spatial
    container_name: safeyatra-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://safeyatra_user:safeyatra_pass@postgres:5432/safeyatra
      - REDIS_URL=redis://redis:6379
      - ML_ENGINE_URL=http://ml-risk-engine:8000
      - JWT_SECRET=${JWT_SECRET:-dev_secret_change_in_production}
      - JWT_EXPIRES_IN=7d
      - FCM_SERVER_KEY=${FCM_SERVER_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - SIMULATION_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-risk-engine:
        condition: service_started

  admin-dashboard:
    build: ./admin-dashboard
    container_name: safeyatra-admin
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_WS_URL=ws://localhost:3000
      - NEXT_PUBLIC_MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
    depends_on:
      - backend-spatial

volumes:
  pgdata:
    driver: local
